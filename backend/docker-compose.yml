services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override for container-local sqlite file persisted on a volume
      DATABASE_URL: sqlite:////data/gumroad_automation.db
    volumes:
      - backend-data:/data
    restart: unless-stopped

volumes:
  backend-data:
